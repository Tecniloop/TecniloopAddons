    </head>

    <style>
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .h1,
        .h2,
        .h3,
        .h4,
        .h5,
        .h6 {
            font-weight: 400;
            line-height: 1.1;
            color: #212529;
        }
        ul {
            color: #212529;
        }
        .ts_btn
        {
            border: 2px solid #f78c24 !important;
            color:#212529 !important;
        }
        .button-style {
          border: 2px solid #f78c24;  /* Set border color */
          color: #212529;  /* Set text color */
          background-color: transparent;  /* Keep background transparent */
          padding: 10px 20px;  /* Add padding for better appearance */
          font-size: 16px;  /* Set font size */
          cursor: pointer;  /* Change cursor to pointer when hovered */
          transition: all 0.3s ease;  /* Smooth transition for hover effect */
        }

        .button-style:hover {
          background-color: #f78c24;  /* Add background color on hover */
          color: white;  /* Change text color to white on hover */
          border-color: #f78c24;  /* Keep border color same on hover */
        }
        .gradient-background {
            /* Add a gradient background */
            background: linear-gradient(to right, #ff7e5f, #feb47b); /* Adjust colors as needed */
            /* Optional: Set height and width to make it visible */
            height: 300px;
            width: 100%;
            
            /* Optional: Add some padding and center the text */
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
        }
    </style>

    <body>
